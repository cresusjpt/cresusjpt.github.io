# Site de Jean-Paul Tossou, construit par GitHub Pages à chaque push sur master.
# Redémarrer `bundle exec jekyll serve` après toute modification de ce fichier.
# Mêmes faits que saltech.fr et LinkedIn : « Fondateur de Saltech, architecte logiciel ».

title: Jean-Paul Tossou
description: >-
  Fondateur de Saltech, architecte logiciel. Applications mobiles et métier
  depuis 2015, ingénierie des données, objets connectés.
tagline: Architecte logiciel, du capteur à l'application
url: https://www.jeanpaultossou.tech
lang: fr-FR
theme: null # pas de thème GitHub Pages par défaut : gabarits maison
timezone: Europe/Paris

author:
  name: Jean-Paul Tossou
  role: Fondateur de Saltech, architecte logiciel
  email: jeanpaul.tossou@saltech.fr
  linkedin: https://www.linkedin.com/in/jean-paul-tossou/
  github: https://github.com/cresusjpt

saltech: https://saltech.fr

# Page de prise de rendez-vous (planning Google Agenda). Vide = pas de bouton.
rendez_vous: https://calendar.app.google/QawnsYM3SmpEyhUe9

# Données structurées (jekyll-seo-tag)
social:
  name: Jean-Paul Tossou
  links:
    - https://www.linkedin.com/in/jean-paul-tossou/
    - https://github.com/cresusjpt

# Formulaire de contact. Vide = pas de formulaire : la page Contact propose l'e-mail.
# GitHub Pages ne peut pas envoyer d'e-mail lui-même : un formulaire passe par un service externe
# (Forminit, ex-getform.io, ou Formspree). L'adresse getform de 2021 redirige vers l'accueil de Forminit
# et ne garantit plus la livraison. Pour un formulaire : créer un formulaire chez ce service avec
# jeanpaul.tossou@saltech.fr, coller ici son adresse d'envoi, puis faire un envoi test.
contact_form:

# true = affiche les tampons « À VALIDER » sur le contenu supposé.
# Passer à false une fois les textes relus.
hypotheses: true

# Révision du cartouche (lettre de la dernière étape du parcours).
revision: G

permalink: /blog/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "" }
    values: { image: /assets/images/partage.png } # image de partage (LinkedIn, etc.)
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .impeccable
  - .jekyll-cache
